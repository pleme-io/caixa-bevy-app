"[package]\nname = \"bevy_app\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"Provides core App functionality for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[features]\ndefault = [\"std\", \"bevy_reflect\", \"bevy_ecs/default\", \"error_panic_hook\"]\n\n# Functionality\n\n## Adds runtime reflection support using `bevy_reflect`.\nbevy_reflect = [\"dep:bevy_reflect\", \"bevy_ecs/bevy_reflect\"]\n\n## Extends reflection support to functions.\nreflect_functions = [\n  \"bevy_reflect\",\n  \"bevy_reflect/functions\",\n  \"bevy_ecs/reflect_functions\",\n]\nreflect_auto_register = [\n  \"bevy_reflect\",\n  \"bevy_reflect/auto_register\",\n  \"bevy_ecs/reflect_auto_register\",\n]\n\n# Debugging Features\n\n## Enables `tracing` integration, allowing spans and other metrics to be reported\n## through that framework.\ntrace = [\"dep:tracing\"]\n\n## Provides system stepping support, allowing them to be paused, stepped, and\n## other debug operations which can help with diagnosing certain behaviors.\nbevy_debug_stepping = []\n\n## Will set the BevyError panic hook, which gives cleaner filtered backtraces when\n## a BevyError is hit.\nerror_panic_hook = []\n\n# Platform Compatibility\n\n## Allows access to the `std` crate. Enabling this feature will prevent compilation\n## on `no_std` targets, but provides access to certain additional features on\n## supported platforms.\nstd = [\n  \"bevy_reflect?/std\",\n  \"bevy_ecs/std\",\n  \"dep:ctrlc\",\n  \"downcast-rs/std\",\n  \"bevy_platform/std\",\n]\n\n## `critical-section` provides the building blocks for synchronization primitives\n## on all platforms, including `no_std`.\ncritical-section = [\n  \"bevy_ecs/critical-section\",\n  \"bevy_platform/critical-section\",\n  \"bevy_reflect?/critical-section\",\n]\n\n## Enables use of browser APIs.\n## Note this is currently only applicable on `wasm32` architectures.\nweb = [\n  \"bevy_platform/web\",\n  \"bevy_reflect?/web\",\n  \"dep:wasm-bindgen\",\n  \"dep:web-sys\",\n  \"dep:console_error_panic_hook\",\n]\n\nhotpatching = [\n  \"bevy_ecs/hotpatching\",\n  \"dep:dioxus-devtools\",\n  \"dep:crossbeam-channel\",\n]\n\n[dependencies]\n# bevy\nbevy_derive = { path = \"../bevy_derive\", version = \"0.19.0-dev\" }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\", default-features = false }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\", default-features = false, optional = true }\nbevy_utils = { path = \"../bevy_utils\", version = \"0.19.0-dev\", default-features = false }\nbevy_tasks = { path = \"../bevy_tasks\", version = \"0.19.0-dev\", default-features = false }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", default-features = false }\n\n# other\ndowncast-rs = { version = \"2\", default-features = false }\nthiserror = { version = \"2\", default-features = false }\nvariadics_please = \"1.1\"\ntracing = { version = \"0.1\", default-features = false, optional = true }\nlog = { version = \"0.4\", default-features = false }\ndioxus-devtools = { version = \"0.7.0-alpha.1\", optional = true }\ncrossbeam-channel = { version = \"0.5.0\", optional = true }\n\n[target.'cfg(any(all(unix, not(target_os = \"horizon\")), windows))'.dependencies]\nctrlc = { version = \"3.4.4\", optional = true }\n\n[target.'cfg(target_arch = \"wasm32\")'.dependencies]\nwasm-bindgen = { version = \"0.2\", optional = true }\nweb-sys = { version = \"0.3\", features = [\"Window\"], optional = true }\nconsole_error_panic_hook = { version = \"0.1.6\", optional = true }\n\n[dev-dependencies]\ncrossbeam-channel = \"0.5.0\"\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\nfeatures = [\"bevy_reflect/auto_register_static\"]\n"
